<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="pceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="pceAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="pceBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="pceGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- iOS Squircle Base Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#pceBg)" stroke="url(#pceBorder)" stroke-width="1.5"/>

  <!-- Subtle Inner Ambient Mesh Glow -->
  <circle cx="44" cy="20" r="14" fill="#2563eb" fill-opacity="0.2" filter="url(#pceGlow)"/>

  <!-- Branded "P" Geometric Monogram -->
  <!-- Stem -->
  <rect x="18" y="16" width="6.5" height="32" rx="3.25" fill="url(#pceAccent)"/>
  
  <!-- Curved Upper Loop -->
  <path d="M22 16h11.5a10 10 0 0 1 10 10v0a10 10 0 0 1-10 10H22" stroke="url(#pceAccent)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Campus Beacon / Orbital Spark -->
  <circle cx="33.5" cy="26" r="2.75" fill="#ffffff"/>
  <circle cx="48" cy="16" r="2" fill="#38bdf8"/>
</svg>
