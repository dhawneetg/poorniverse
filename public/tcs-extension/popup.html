<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 290px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      background: #ffffff;
      color: #141414;
    }
    h3 {
      margin: 0 0 4px 0;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0 0 12px 0;
      font-size: 12px;
      color: #707070;
      line-height: 1.4;
    }
    button {
      width: 100%;
      background: #141414;
      color: #ffffff;
      border: none;
      padding: 10px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    button:hover {
      background: #262626;
    }
    .url-group {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #e0e0e0;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #707070;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid #e0e0e0;
      font-size: 11px;
      background: #f8f9fa;
    }
    .status {
      margin-top: 10px;
      font-size: 11px;
      color: #047857;
      text-align: center;
      display: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <h3>Poornima Sync</h3>
  <p>1-Click extract attendance from TCS iON and sync to Poornima Companion OS.</p>
  <button id="btn-sync">Extract & Copy Attendance</button>
  <div id="status" class="status">✓ Attendance copied! Opening app...</div>

  <div class="url-group">
    <label>Deployed Vercel / App URL:</label>
    <input type="text" id="target-url" placeholder="http://localhost:4321 or your Vercel URL" />
  </div>
  <script src="popup.js"></script>
</body>
</html>
